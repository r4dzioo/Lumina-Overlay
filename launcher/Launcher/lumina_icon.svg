<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1520"/>
      <stop offset="100%" stop-color="#0D1C2E"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18A35E"/>
      <stop offset="100%" stop-color="#4FEBA0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#22D97E" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="256" height="256" rx="52" ry="52" fill="url(#bg)"/>

  <!-- Thin accent border -->
  <rect x="3" y="3" width="250" height="250" rx="50" ry="50"
        fill="none" stroke="#22D97E" stroke-width="3" opacity="0.4"/>

  <!-- "L" letter mark with gradient and glow -->
  <text x="56" y="192"
        font-family="Segoe UI, Arial, sans-serif"
        font-weight="900"
        font-size="178"
        fill="url(#glow)"
        filter="url(#shadow)"
        letter-spacing="-8">L</text>

  <!-- Small corner accent dot -->
  <circle cx="198" cy="196" r="12" fill="#22D97E" opacity="0.85"/>
  <circle cx="198" cy="196" r="6"  fill="#EEF3F8"/>
</svg>
